<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- JS -->
  <script src="assets/js/supabaseClient.js" defer></script>
  <script src="assets/js/utils.js" defer></script>
  <script src="assets/js/candidatos.js" defer></script>
  <script src="assets/js/vagas.js" defer></script>
  <script src="assets/js/entrevistas.js" defer></script>
  <script src="assets/js/pipeline.js" defer></script>
  <script src="assets/js/dashboard.js" defer></script>
</head>

<body>
  <div class="sidebar">
    <img src="midia/logo.png" alt="" class="logo-sidebar">
    <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Início</a>
    <a class="nav-item" href="Candidatos.html"><i class="fa-solid fa-users"></i>Candidatos</a>
    <a class="nav-item" href="vagas.html"><i class="fa-solid fa-briefcase"></i>Vagas</a>
    <a class="nav-item" href="Pipeline.html"><i class="fa-solid fa-chart-column"></i>Fluxo</a>
    <a class="nav-item active" href="Entrevistas.html"><i class="fa-solid fa-calendar-check"></i>Entrevistas</a>
  </div>
  <div class="main main-entrevistas">
    <!-- Header -->
    <header class="page-header">
      <div class="header-content">
        <h1>Entrevistas</h1>
        <p class="subtitle">Gerencie todas as suas entrevistas agendadas</p>
      </div>
      <button class="btn-primary" id="btnNovoAgendamento">
        <i class="fa-solid fa-plus"></i> Agendar Entrevista
      </button>
    </header>

    <!-- Stats Row -->
    <div class="stats-grid">
      <div class="stat-card" style="border-left: 4px solid #6366f1;"> <!-- Indigo -->
        <div class="stat-header">
          <span class="dot" style="background: #6366f1;"></span>
          <span class="stat-label">Hoje</span>
        </div>
        <div class="stat-value" id="statHoje">0</div>
      </div>
      <div class="stat-card" style="border-left: 4px solid #3b82f6;"> <!-- Blue -->
        <div class="stat-header">
          <span class="dot" style="background: #3b82f6;"></span>
          <span class="stat-label">Esta Semana</span>
        </div>
        <div class="stat-value" id="statSemana">0</div>
      </div>
      <div class="stat-card" style="border-left: 4px solid #22c55e;"> <!-- Green -->
        <div class="stat-header">
          <span class="dot" style="background: #22c55e;"></span>
          <span class="stat-label">Presenciais</span>
        </div>
        <div class="stat-value" id="statPresenciais">0</div>
      </div>
      <div class="stat-card" style="border-left: 4px solid #eab308;"> <!-- Yellow -->
        <div class="stat-header">
          <span class="dot" style="background: #eab308;"></span>
          <span class="stat-label">Agendadas</span>
        </div>
        <div class="stat-value" id="statPendentes">0</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-bar">
      <div class="filters-group">
        <div class="filter-wrapper">
          <i class="fa-solid fa-filter"></i>
          <span>Filtros:</span>
        </div>
        <select class="filter-select" id="filterType">
          <option value="all">Todos os tipos </option>
          <option value="presencial"> Presencial</option>
          <option value="video"><i class="fa-solid fa-video"></i> Vídeo</option>
          <option value="telefone"><i class="fa-solid fa-phone"></i> Telefone</option>
        </select>
        <select class="filter-select" id="filterStatus">
          <option value="all">Todos os status</option>
          <option value="agendada">Agendada</option>
          <option value="concluida">Concluída</option>
        </select>
        <button class="btn-text" id="btnClearFilters">Limpar</button>
      </div>

      <div class="view-toggles">
        <button class="toggle-btn active" id="viewCalendar"><i class="fa-regular fa-calendar"></i> Calendário</button>
        <button class="toggle-btn" id="viewList"><i class="fa-solid fa-list"></i> Lista</button>
      </div>
    </div>

    <!-- Calendar Layout -->
    <div class="calendar-layout" id="calendarViewContainer">
      <!-- Calendar Component -->
      <div class="calendar-container">
        <div class="calendar-header">
          <h2 id="currentMonthDisplay">Janeiro 2024</h2>
          <div class="calendar-nav">
            <button class="nav-btn" id="prevMonth"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="nav-btn today-btn" id="goToday">Hoje</button>
            <button class="nav-btn" id="nextMonth"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>

        <div class="calendar-grid">
          <div class="weekday">Dom</div>
          <div class="weekday">Seg</div>
          <div class="weekday">Ter</div>
          <div class="weekday">Qua</div>
          <div class="weekday">Qui</div>
          <div class="weekday">Sex</div>
          <div class="weekday">Sáb</div>

          <!-- Days will be injected here via JS -->
          <div id="calendarDaysGrid" class="days-grid"></div>
        </div>
      </div>

      <!-- Side Panel -->
      <div class="day-details-panel">
        <div class="day-details-header"
          style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3 id="selectedDateDisplay" style="margin: 0;">25 de Janeiro</h3>
          <button class="btn-icon-only" id="btnOpenListFromSide" title="Ver em lista"
            style="background: var(--hover-dark); border: 1px solid var(--border-dark); color: var(--text-light); padding: 8px; border-radius: 6px; cursor: pointer;">
            <i class="fa-solid fa-up-right-from-square"></i>
          </button>
        </div>

        <div class="day-events-list" id="dayEventsList">
          <!-- Events will be injected here -->
          <div class="empty-state-small">Nenhuma entrevista para este dia</div>
        </div>
      </div>
    </div>

    <!-- List Layout (Hidden by default) -->
    <div class="list-layout-grid" id="listViewContainer" style="display: none;">
      <!-- Cards will be injected here -->
    </div>

  </div> <!-- End Main -->

  <!-- Modal Agendamento (Hidden by default) -->
  <div id="agendamentoModal" class="modal">
    <div class="modal-content-vaga">
      <div class="modal-header">
        <h2>Agendar Entrevista</h2>
        <span class="close" id="closeAgendamentoModal">&times;</span>
      </div>
      <form id="agendamentoForm" class="vaga-form-v2">
        <input type="hidden" id="agendamentoId">

        <div class="form-group-v2">
          <label>Candidato</label>
          <div class="searchable-dropdown" id="dropdownCandidato">
            <input type="text" id="searchCandidato" placeholder="Pesquisar candidato..." class="filter-select"
              autocomplete="off" style="width: 100%;">
            <input type="hidden" id="agCandidato">
            <div class="dropdown-options" id="optionsCandidato"></div>
          </div>
        </div>

        <div class="form-group-v2">
          <label>Vaga</label>
          <div class="searchable-dropdown" id="dropdownVaga">
            <input type="text" id="searchVaga" placeholder="Pesquisar vaga..." class="filter-select" autocomplete="off"
              style="width: 100%;">
            <input type="hidden" id="agVaga">
            <div class="dropdown-options" id="optionsVaga"></div>
          </div>
        </div>

        <div class="form-group-v2">
          <label>Tipo de Entrevista</label>
          <select id="agTipo" required class="filter-select" style="width:100%">
            <option value="Presencial">Presencial</option>
            <option value="Online">Vídeo</option>
            <option value="Telefone">Telefone</option>
          </select>
        </div>

        <div class="form-group-v2">
          <label>Data e Hora</label>
          <input type="datetime-local" id="agDataHora" required
            style="background-color: #0f172a;padding: 10px 12px; border: 1px solid #334155; border-radius: 8px; font-size: 14px; font-family: inherit; transition: all 0.3s ease; width: 100%; box-sizing: border-box;"
            onfocus="this.style.borderColor='#334155'; this.style.boxShadow='0 0 0 3px rgba(99, 102, 241, 0.1)';"
            onblur="this.style.borderColor='#e5e7eb'; this.style.boxShadow='none';">
        </div>

        <div class="form-group-v2">
          <label>Entrevistador</label>
          <select id="agEntrevistador" required class="filter-select" style="width:100%"></select>
        </div>

        <div class="form-group-v2">
          <label>Observações</label>
          <textarea id="agObs" rows="3"></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" id="cancelAgendamento">Cancelar</button>
          <button type="submit" class="btn-submit">Agendar</button>
        </div>
      </form>
    </div>
  </div>

</body>

</html>
