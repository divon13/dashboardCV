<!DOCTYPE html>
<!--
  index.html — Dashboard Principal (Página Inicial)
  ─────────────────────────────────────────────────────────────
  Esta é a página de entrada da aplicação. Exibe:
    1. Sidebar de navegação (partilhada em todas as páginas)
    2. Cards de métricas: Total de Candidatos, Vagas Abertas, Entrevistas Hoje
    3. Secção "Próximas Entrevistas" com os próximos 7 agendamentos

  Os valores dos cards são preenchidos dinamicamente pelo JavaScript:
    - #total-candidatos-val → carregarCandidatos() em candidatos.js
    - #vagas-abertas-val    → carregarVagasAbertas() em vagas.js
    - #entrevistas-hoje-val → carregarEntrevistas() em entrevistas.js
    - #entrevistasContainer → carregarEntrevistas() em entrevistas.js

  Os SVG dentro dos <p> são loaders animados que ficam visíveis
  enquanto os dados estão a ser carregados do Supabase.
  ─────────────────────────────────────────────────────────────
-->
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="midia/logo.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/style.css">

  <!-- Supabase SDK e ícones Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Scripts JS carregados com defer (executam após o HTML estar pronto) -->
  <!-- A ordem importa: supabaseClient deve ser o primeiro -->
  <script src="assets/js/supabaseClient.js" defer></script>
  <script src="assets/js/utils.js" defer></script>
  <script src="assets/js/candidatos.js" defer></script>
  <script src="assets/js/vagas.js" defer></script>
  <script src="assets/js/entrevistas.js" defer></script>
  <script src="assets/js/pipeline.js" defer></script>
  <script src="assets/js/dashboard.js" defer></script><!-- Deve ser o último (orquestra os outros) -->
  <title>Dashboard RH</title>
</head>

<body>

  <!-- ── Sidebar de Navegação ──────────────────────────────────────────── -->
  <!-- Fixa à esquerda em todas as páginas. O item "active" indica a página atual. -->
  <div class="sidebar">
    <img src="midia/logo.png" alt="" class="logo-sidebar">
    <a class="nav-item active" href="index.html"><i class="fa-solid fa-house"></i>Início</a>
    <a class="nav-item" href="Candidatos.html"><i class="fa-solid fa-users"></i>Candidatos</a>
    <a class="nav-item" href="vagas.html"><i class="fa-solid fa-briefcase"></i>Vagas</a>
    <a class="nav-item" href="Pipeline.html"><i class="fa-solid fa-chart-column"></i>Fluxo</a>
    <a class="nav-item" href="Entrevistas.html"><i class="fa-solid fa-calendar-check"></i>Entrevistas</a>
  </div>

  <!-- ── Conteúdo Principal ────────────────────────────────────────────── -->
  <div class="main">

    <!-- Cards de Métricas (linha horizontal com 3 cards) -->
    <div class="cards">

      <!-- Card 1: Total de Candidatos — preenchido por carregarCandidatos() -->
      <div class="card">
        <div class="card-header">
          <h3>Total de Candidatos</h3>
          <i class="fa-solid fa-people-group"></i>
        </div>
        <!-- SVG loader visível durante o carregamento; substituído pelo número -->
        <p id="total-candidatos-val">
          <svg viewBox="25 25 50 50" class="container">
            <circle cx="50" cy="50" r="20" class="loader"></circle>
          </svg>
        </p>
      </div>

      <!-- Card 2: Vagas Abertas — preenchido por carregarVagasAbertas() -->
      <div class="card">
        <div class="card-header">
          <h3>Vagas Abertas</h3>
          <i class="fa-solid fa-briefcase"></i>
        </div>
        <p id="vagas-abertas-val">
          <svg viewBox="25 25 50 50" class="container">
            <circle cx="50" cy="50" r="20" class="loader"></circle>
          </svg>
        </p>
      </div>

      <!-- Card 3: Entrevistas Hoje — preenchido por carregarEntrevistas() -->
      <div class="card">
        <div class="card-header">
          <h3>Entrevistas Hoje</h3>
          <i class="fa-solid fa-calendar-day"></i>
        </div>
        <p id="entrevistas-hoje-val">0</p>
      </div>
    </div>

    <!-- ── Secção "Próximas Entrevistas" ──────────────────────────────── -->
    <!-- Os cards são inseridos dinamicamente por carregarEntrevistas() em entrevistas.js -->
    <div class="entrevistas-section">
      <h2 class="section-title">Próximas Entrevistas <i class="fa-solid fa-calendar"></i></h2>
      <div id="entrevistasContainer" class="cards-entrevistas">
        <!-- Loader inicial — substituído pelos cards após o carregamento -->
        <div class="loading-entrevistas">
          <svg viewBox="25 25 50 50" class="container">
            <circle cx="50" cy="50" r="20" class="loader"></circle>
          </svg>
        </div>
      </div>
    </div>

</body>

</html>
